apiVersion: hee/v1
kind: Registry
metadata:
  name: shared-regex-patterns
  description: "One canonical source for regexes used across sh, bash, awk, python and go. Patterns are RE2/POSIX-ERE safe by default so the SAME string works in every engine, and each carries its own match/reject tests so cross-engine agreement is proved mechanically rather than assumed."
  labels:
    hee.object: "true"
    domain: tcos
    scope: library
    topic: regex
    artifact: registry
  annotations:
    inuid: null
    inuid_null_reason: bootstrap
    created_utc: "2026-08-31T00:00:00Z"

spec:
  # ---------------------------------------------------------------------
  # THE CONSTRAINT THAT SHAPES EVERYTHING HERE
  #
  # Engines do not agree, and the disagreement is silent:
  #
  #   PCRE / python   lookaround, \d, \w, non-capturing groups
  #   POSIX ERE       none of the above. No lookaround at all.
  #   bash =~         POSIX ERE
  #   awk             POSIX ERE
  #   go RE2          NO lookaround, NO backreferences, by design
  #
  # Measured 2026-08-31: the version pattern in hee_toolver was written
  # with lookbehind and lookahead. It compiled in python and FAILED in
  # grep -E and bash =~, and RE2 forbids both constructs outright. It had
  # been "working" only because it was used from python and nowhere else.
  #
  # So the default dialect here is the intersection: RE2-safe POSIX ERE.
  #   * no lookaround -- use a boundary group and capture the payload
  #   * no \d \w \s   -- use [0-9] [A-Za-z0-9_] [[:space:]]
  #   * no (?: )      -- plain groups, and name the capture index
  #
  # A pattern that genuinely cannot be expressed that way declares an
  # `overrides` block per engine AND says why. That is the exception, and
  # it must be justified, not merely convenient.
  #
  # `tests` are not documentation. The validator (hee-check regex) runs
  # every pattern against every engine present on the box and fails if any
  # engine disagrees with any other. Adding a pattern without tests is how
  # this registry silently rots.
  # ---------------------------------------------------------------------

  dialect: "posix-ere-re2-safe"

  # Shell scripts in this org are POSIX. `[[ str =~ re ]]` is a bash
  # extension and POSIX sh has no regex operator at all -- sh reaches regex
  # only through grep, sed, expr or awk. So a pattern must work as an
  # argument to those tools, not merely inside bash. bash =~ is still
  # validated, as a canary, not as a supported calling convention.
  #
  # rg is the org's preferred search tool and uses the Rust regex crate:
  # linear-time, no lookaround, no backreferences. Verified 2026-08-31 that
  # it rejects `a(?=b)` outright. That makes rg the strictest portability
  # canary available, so a pattern rg cannot compile is not fit for use here.
  #
  # grep -P (PCRE2) IS available on this host and supports lookaround. It is
  # deliberately not used: a pattern written for it silently fails in rg, awk,
  # sed and Go.

  patterns:
    - name: version
      description: "A software version in a tool's --version output. At least major.minor -- a bare integer is not a version, which is what separates a real version from 'sh: 0: Illegal option --'."
      ere: '(^|[^0-9.])v?([0-9]+\.[0-9]+(\.[0-9]+)*)([^0-9.]|$)'
      capture: 2
      notes:
        - "The leading boundary group replaces a lookbehind; the trailing one replaces a lookahead. Both are required for RE2 and POSIX ERE."
        - "An optional leading 'v' is matched but NOT captured, so 'version v4.53.3' yields 4.53.3. Omitting it caused a real failure: yq's version was rejected, the probe fell through to `yq -v` -- which means VERBOSE on yq -- and a timestamp was captured as a version."
      tests:
        match:
          - { input: "tmux 3.4", expect: "3.4" }
          - { input: "jq-1.7", expect: "1.7" }
          - { input: "GNU bash, version 5.2.21(1)-release", expect: "5.2.21" }
          - { input: "ripgrep 14.1.0", expect: "14.1.0" }
          - { input: "yq (https://github.com/mikefarah/yq/) version v4.53.3", expect: "4.53.3" }
          - { input: "ls (GNU coreutils) 9.4", expect: "9.4" }
          - { input: "mawk 1.3.4 20240123", expect: "1.3.4" }
        reject:
          - "sh: 0: Illegal option --"
          - "usage: tmux [-2CDlNuVv]"
          - "error: unknown option"
          - "no version available"

    - name: iso_timestamp
      description: "An ISO-8601-ish timestamp. Exists to be REJECTED before version matching -- a timestamp is full of dotted digits and will otherwise satisfy the version pattern."
      ere: '[0-9]{4}-[0-9]{2}-[0-9]{2}[T ][0-9]{2}:[0-9]{2}|[0-9]{2}:[0-9]{2}:[0-9]{2}'
      capture: 0
      notes:
        - "Real trigger: `yq -v` enabled debug logging and printed time=2026-08-31T14:33:35.153-05:00, from which '16.691-05' was extracted as a version."
      tests:
        match:
          - { input: "time=2026-08-31T14:33:35.153-05:00 level=DEBUG", expect: "2026-08-31T14:33" }
          - { input: "started at 14:33:35 today", expect: "14:33:35" }
        reject:
          - "tmux 3.4"
          - "version 5.2.21"

    - name: bare_issue_ref
      description: "A bare #N issue reference, which resolves to the wrong repo in a multi-repo workspace. Used by the agent hook that warns on these."
      ere: '(^|[^:/A-Za-z0-9_])#([0-9]+)'
      capture: 2
      notes:
        - "The boundary group excludes ':' and '/' so issue:12@repo and a URL path /issues/12 do not match."
      tests:
        match:
          - { input: "fixes #151 in the thing", expect: "151" }
          - { input: "see #42", expect: "42" }
        reject:
          - "https://github.com/o/r/issues/151"
          - "issue:416@human-execution-engine"
          - "repo#151"

    - name: hardcoded_home
      description: "A hardcoded /home/<user>/ path in a committed file. Breaks for every other operator, silently."
      ere: '/home/[a-z][a-z0-9_-]*/'
      capture: 0
      tests:
        match:
          - { input: "see /home/spencer/git/foo", expect: "/home/spencer/" }
          - { input: "path: /home/claude/.claude/x", expect: "/home/claude/" }
        reject:
          - "$HOME/git/foo"
          - "~/git/foo"
          - "/usr/share/foo"
