apiVersion: hee/v1
kind: Registry
metadata:
  name: shared-regex-patterns
  description: "One canonical source for regexes used across sh, bash, awk, python and go. Patterns are RE2/POSIX-ERE safe by default so the SAME string works in every engine, and each carries its own match/reject tests so cross-engine agreement is proved mechanically rather than assumed."
  labels:
    hee.object: "true"
    domain: tcos
    scope: library
    topic: regex
    artifact: registry
  annotations:
    inuid: null
    inuid_null_reason: bootstrap
    created_utc: "2026-08-31T00:00:00Z"

spec:
  # ---------------------------------------------------------------------
  # THERE IS NO ONE REGEX TO RULE THEM ALL.
  #
  # Operator, 2026-08-31: "we use what each lang supports, to it's fullest.
  # that may be a trigger to write the tool in the next up lang if regex is
  # a bottle neck".
  #
  # So this registry is NOT a lowest-common-denominator dialect. Each
  # pattern is written for the engine that will actually run it, using that
  # engine fully. What it must do is SAY WHICH ENGINE -- an undeclared lane
  # is how a PCRE pattern ends up in an sh script and fails silently.
  #
  # Engines differ, and differ quietly:
  #
  #   python re, perl   lookaround, backrefs, \d \w \s
  #   POSIX ERE         none of those. grep -E, sed -E, awk, bash =~
  #   rust regex (rg)   linear-time, NO lookaround, NO backrefs
  #   go RE2            same constraints as rg, by design
  #   POSIX sh          no regex operator AT ALL -- shells out to the above
  #
  # WHEN REGEX IS THE BOTTLENECK, MOVE THE TOOL UP THE LADDER.
  # PROMPTING_RULES rule 13 has tools start at the least capable language
  # that does the job. If a tool written in sh needs a pattern sh's engines
  # cannot express, the answer is not to mangle the pattern into POSIX ERE
  # and lose precision -- it is that the tool has outgrown sh. Graduate it
  # to python and use `re` properly. A contorted portable pattern is a
  # symptom; the language choice is the actual decision.
  #
  # `tests` are not documentation. `hee-check regex` runs every pattern
  # against every engine IN ITS OWN LANE and fails if any disagree. Adding
  # a pattern without tests is how this registry silently rots.
  # ---------------------------------------------------------------------

  # LANES -- a pattern declares where it must work, and is only tested there.
  #
  # Not every regex has to run everywhere. Forcing one dialect on all of them
  # makes precision impossible: some jobs genuinely need lookaround, and a
  # pattern that will only ever be called from python should be allowed to
  # use it. What is NOT allowed is an undeclared lane, because that is how a
  # PCRE pattern ends up in an sh script and fails silently.
  #
  #   portable  every engine here: python, grep -E, bash, awk, sed -E, rg, perl
  #             required when a shell tool will call it. Precision is capped
  #             by the weakest engine -- if that costs too much, that is the
  #             ladder-graduation signal, not something to work around.
  #   pcre      python, perl, grep -P only. Lookaround and backrefs allowed.
  #             MUST NOT be used from sh, awk, sed, rg or Go.
  #   python    python only -- internal to a python library. Use `re` to its
  #             fullest here; there is no reason to hold back.
  #
  # `hee-check regex` tests each pattern in its declared lane and fails if any
  # engine IN THAT LANE disagrees. A portable pattern using a PCRE construct
  # is a hard failure.
  default_lane: "portable"
  lanes:
    portable: [python, "grep -E", "bash =~", awk, "sed -E", rg, perl]
    pcre:     [python, perl, "grep -P"]
    python:   [python]

  # Shell scripts in this org are POSIX. `[[ str =~ re ]]` is a bash
  # extension and POSIX sh has no regex operator at all -- sh reaches regex
  # only through grep, sed, expr or awk. So a pattern must work as an
  # argument to those tools, not merely inside bash. bash =~ is still
  # validated, as a canary, not as a supported calling convention.
  #
  # rg is the org's preferred search tool and uses the Rust regex crate:
  # linear-time, no lookaround, no backreferences. Verified 2026-08-31 that
  # it rejects `a(?=b)` outright. That makes rg the strictest portability
  # canary available, so a pattern rg cannot compile is not fit for use here.
  #
  # grep -P (PCRE2) IS available on this host and supports lookaround. It is
  # deliberately not used: a pattern written for it silently fails in rg, awk,
  # sed and Go.

  patterns:
    - name: en-gb-spelling
      description: "British spellings this org does not use. An EXPLICIT WORD LIST, never a generic -ise/-our rule: 'otherwise', 'raise', 'promise', 'concise', 'four', 'hour' and 'favour' are all -ise or -our and only one of them is wrong."
      lane: portable
      ere: '(^|[^A-Za-z])([Cc]olour|[Cc]oloured|[Cc]olours|[Bb]ehaviour|[Bb]ehaviours|[Aa]nalyse|[Aa]nalysed|[Aa]nalyses|[Aa]nalysing|[Nn]ormalise|[Nn]ormalised|[Nn]ormalises|[Rr]ecognise|[Rr]ecognised|[Rr]ecognises|[Uu]nrecognised|[Oo]rganise|[Oo]rganised|[Oo]rganisation|[Ss]ummarise|[Ss]ummarised|[Ss]ummarises|[Pp]ersonalise|[Pp]ersonalised|[Pp]rioritise|[Pp]rioritised|[Ss]tandardise|[Cc]ustomise|[Ii]nitialise|[Oo]ptimise|[Ss]erialise|[Ss]pecialise|[Ss]ynchronise|[Uu]tilise|[Cc]atalogue|[Dd]efence)([^A-Za-z]|$)'
      capture: 2
      notes:
        - "US English is required org-wide (~/.claude/CLAUDE.md). The rule exists because spelling is invisible to whoever writes it -- an agent used 'colour' through a whole session and quoted infrastructure costs as £0 in a real GitHub comment before anyone noticed."
        - "A GENERIC -ise rule is the obvious implementation and it is wrong. Measured 2026-09-01 on a real diff: a broad '[a-z]+ise' sweep flagged 'otherwise' and 'raise'; a broad '[a-z]+our' sweep flagged 'four'. An explicit list has no false positives and is the only honest shape."
        - "'grey' is deliberately ABSENT. It is a valid CSS color keyword, so flagging it would break real stylesheets. 'centre' is absent for the same class of reason -- it appears inside proper nouns."
        - "'licence' is absent: US English uses 'license' for both noun and verb, so the noun form is not worth flagging separately from the verb."
        - "Boundary groups, not \\b. awk has no \\b -- in awk regex it is a BACKSPACE -- so a \\b pattern silently matches nothing there while working everywhere else. Caught by this registry's own cross-engine test on the first run of this pattern, which is what the registry is for. Same technique the version pattern uses for its lookaround replacements."
      tests:
        match:
          - { input: "never colour alone", expect: "colour" }
          - { input: "Authoritative for behaviour, but tools lie", expect: "behaviour" }
          - { input: "was not recognised as help", expect: "recognised" }
          - { input: "Legacy words normalise in", expect: "normalise" }
          - { input: "the ticket carries an unrecognised stage", expect: "unrecognised" }
          - { input: "Colour words are accepted for migration", expect: "Colour" }
        reject:
          - "otherwise the tool exits 0"
          - "raise SystemExit(status)"
          - "four candidate forms tested live"
          - "a concise summary of the run"
          - "promise the operator nothing"
          - "grey is a valid CSS keyword"
          - "color theory principles"
          - "behavior is what the label describes"
    - name: version
      description: "A software version in a tool's --version output. At least major.minor -- a bare integer is not a version, which is what separates a real version from 'sh: 0: Illegal option --'."
      lane: portable
      ere: '(^|[^0-9.])v?([0-9]+\.[0-9]+(\.[0-9]+)?(\.[0-9]+)?(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)([^0-9.]|$)'
      capture: 2
      notes:
        - "The leading boundary group replaces a lookbehind; the trailing one replaces a lookahead. Both are required for RE2 and POSIX ERE."
        - "Shaped by SemVer (semver.org): MAJOR.MINOR.PATCH with optional -prerelease and +build. That is the standard most tools follow, so it is the strongest available clue -- not a guarantee, since plenty of tools ignore it, but a far better basis than an arbitrary length cap."
        - "Two components are accepted because real tools emit them (tmux 3.4). A fourth is accepted because some tools use it. Beyond four is rejected: unbounded (\\.[0-9]+)* matched this org's own PEN OID 1.3.6.1.4.1.66550 as a version. An OID is not semver-shaped, and that is exactly what the bound encodes."
        - "Prerelease (-rc.1, -beta) and build (+abc123) suffixes are captured, per SemVer. Previously they were silently truncated, so 1.2.3-rc.1 recorded as 1.2.3 -- a different release reported as the released one."
        - "A four-part IP still matches and is accepted: an IP is not realistic --version output, and excluding it would reject genuine four-part versions."
        - "An optional leading 'v' is matched but NOT captured, so 'version v4.53.3' yields 4.53.3. Omitting it caused a real failure: yq's version was rejected, the probe fell through to `yq -v` -- which means VERBOSE on yq -- and a timestamp was captured as a version."
      tests:
        match:
          - { input: "tmux 3.4", expect: "3.4" }
          - { input: "jq-1.7", expect: "1.7" }
          - { input: "GNU bash, version 5.2.21(1)-release", expect: "5.2.21" }
          - { input: "ripgrep 14.1.0", expect: "14.1.0" }
          - { input: "yq (https://github.com/mikefarah/yq/) version v4.53.3", expect: "4.53.3" }
          - { input: "ls (GNU coreutils) 9.4", expect: "9.4" }
          - { input: "mawk 1.3.4 20240123", expect: "1.3.4" }
          - { input: "myapp 2.0.0-rc.1", expect: "2.0.0-rc.1" }
          - { input: "build 1.4.2+20260831", expect: "1.4.2+20260831" }
          - { input: "kernel 6.8.0-45", expect: "6.8.0-45" }
        reject:
          - "sh: 0: Illegal option --"
          - "usage: tmux [-2CDlNuVv]"
          - "error: unknown option"
          - "no version available"
          - "base OID 1.3.6.1.4.1.66550 for TCOS"
          - "OID arc 1.3.6.1.4.1 assigned by IANA"

    - name: iso_timestamp
      lane: portable
      description: "An ISO-8601-ish timestamp. Exists to be REJECTED before version matching -- a timestamp is full of dotted digits and will otherwise satisfy the version pattern."
      ere: '[0-9]{4}-[0-9]{2}-[0-9]{2}[T ][0-9]{2}:[0-9]{2}|[0-9]{2}:[0-9]{2}:[0-9]{2}'
      capture: 0
      notes:
        - "Real trigger: `yq -v` enabled debug logging and printed time=2026-08-31T14:33:35.153-05:00, from which '16.691-05' was extracted as a version."
      tests:
        match:
          - { input: "time=2026-08-31T14:33:35.153-05:00 level=DEBUG", expect: "2026-08-31T14:33" }
          - { input: "started at 14:33:35 today", expect: "14:33:35" }
        reject:
          - "tmux 3.4"
          - "version 5.2.21"

    - name: bare_issue_ref
      lane: portable
      description: "A bare #N issue reference, which resolves to the wrong repo in a multi-repo workspace. Used by the agent hook that warns on these."
      ere: '(^|[^:/A-Za-z0-9_])#([0-9]+)'
      capture: 2
      notes:
        - "The boundary group excludes ':' and '/' so issue:12@repo and a URL path /issues/12 do not match."
      tests:
        match:
          - { input: "fixes #151 in the thing", expect: "151" }
          - { input: "see #42", expect: "42" }
        reject:
          - "https://github.com/o/r/issues/151"
          - "issue:416@human-execution-engine"
          - "repo#151"

    - name: hardcoded_home
      lane: portable
      description: "A hardcoded /home/<user>/ path in a committed file. Breaks for every other operator, silently."
      ere: '/home/[a-z][a-z0-9_-]*/'
      capture: 0
      tests:
        match:
          - { input: "see /home/spencer/git/foo", expect: "/home/spencer/" }
          - { input: "path: /home/claude/.claude/x", expect: "/home/claude/" }
        reject:
          - "$HOME/git/foo"
          - "~/git/foo"
          - "/usr/share/foo"
