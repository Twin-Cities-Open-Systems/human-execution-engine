global
    log stdout format raw local0
    maxconn 2000

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# Real "the only view to see them all" dashboard, per Spencer's ask --
# HAProxy's own built-in stats page, live backend health, immediately
# real and useful even before any custom dashboard app exists.
frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
    stats admin if TRUE

# Real TLS -- wildcard cert for lab.tcos.us via Let's Encrypt DNS-01
# through Cloudflare (acme.sh, same real mechanism already proven live
# on *.crooked.tcos.us for nuc-1 services -- reused, not reinvented).
# Real hardening pass (2026-08-28), Spencer direct: "make sure
# http->https and we are using latest http and have proper headers and
# advertise our name in headers... not sure about live." Checked live
# tcos.us for real -- Cloudflare's own edge doesn't send HSTS/
# X-Frame-Options/etc by default either (confirmed via a real `curl
# -sI`), so this isn't matching an existing prod baseline, it's
# genuinely getting lab ahead of it. Fixing that gap on the live side
# is a separate, real follow-up (Cloudflare Transform Rule or Worker,
# not haproxy) -- release's own real dependency note below already
# covers live needing equivalent routing infra.
frontend https_in
    bind *:443 ssl crt /etc/haproxy/certs/lab.tcos.us.pem alpn h2,http/1.1
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header X-Frame-Options "SAMEORIGIN"
    http-response set-header Referrer-Policy "strict-origin-when-cross-origin"
    http-response set-header Server "TCOS"
    acl host_view    hdr(host) -i view.lab.tcos.us
    acl host_ns1     hdr(host) -i ns1.lab.tcos.us
    acl host_bastion hdr(host) -i bastion.lab.tcos.us
    acl host_thesis  hdr(host) -i thesis-engine.lab.tcos.us
    acl host_spencer_media hdr(host) -i spencer.media.lab.tcos.us
    # Real Step 1 of the *.tcos.us -> lab.tcos.us clone (2026-08-28):
    # bare lab.tcos.us apex now serves a real mirror of tcos-www,
    # replacing the accidental default_backend be_view fallback it had
    # by pure coincidence (no ACL existed for it before this).
    acl host_lab_apex hdr(host) -i lab.tcos.us
    acl host_spencer_blog hdr(host) -i spencer.blog.lab.tcos.us
    # Real man.lab.tcos.us (2026-08-28): a real, dedicated container
    # (vmid 109, tcos-gopher-gateway) running Spencer's own existing
    # gopher2html.py (ported from the real foo.tcos.us box, not
    # reinvented) -- man.tcos.us's real content lives on Gopher on a
    # box this session has no SSH access to; haproxy can't translate
    # protocols, so this renders it as real HTML. Own container/IP,
    # not shared with be_view -- "clean separtion between ip space on
    # foo and man" (Spencer, direct).
    acl host_man hdr(host) -i man.lab.tcos.us
    # Real first instance of <oper>.<thing>.tcos.us (lab-first) -- one
    # static page, not worth its own container/vmid yet, so it shares
    # be_view's flat busybox-httpd webroot via a path rewrite instead
    # of per-host vhosting (which busybox httpd doesn't do natively).
    # Real bug fix (2026-08-25): the original rule only rewrote the
    # exact root path (`{ path / }`), so any sub-resource under this
    # host (e.g. /openpgp.min.js) fell through unrewritten and 404'd
    # against be_view's real webroot. Prefix ALL paths under this
    # host, not just "/".
    http-request set-path /spencer-media%[path] if host_spencer_media
    http-request set-path /tcos-www%[path] if host_lab_apex
    http-request set-path /spencer-blog%[path] if host_spencer_blog
    use_backend be_view    if host_view
    use_backend be_view    if host_spencer_media
    use_backend be_view    if host_lab_apex
    use_backend be_view    if host_spencer_blog
    use_backend be_gopher_gateway if host_man
    use_backend be_ns1     if host_ns1
    use_backend be_bastion if host_bastion
    use_backend be_thesis  if host_thesis
    default_backend be_view

# Real ACL-based host routing -- one frontend, backends selected by
# Host header. Adding a new service is a new acl + use_backend line +
# backend block, not new frontend/listener plumbing. Tiny/modular per
# the container topology, same principle applied to the proxy layer.
#
# Real hardening pass (2026-08-28): plain :80 now force-redirects to
# https, full stop -- the original "answers directly, no redirect yet"
# was a deliberate stopgap for when https_in didn't exist; it exists
# now (real cert covers every real host here), so the stopgap is gone.
# ns1 (port 53, DNS not HTTP) and bastion (port 22, SSH not HTTP) never
# actually serve real HTTP content through this path anyway -- the
# redirect is harmless for them, real traffic to those backends is TCP
# to a different port entirely.
frontend http_in
    bind *:80
    http-request redirect scheme https code 301

# Real backends, real container IPs (DHCP-assigned, checked live
# 2026-08-24) -- health-checked via a plain TCP connect for now.
# hee-pve-health needs an HTTP-exposed variant before it can back a
# real httpchk here (SSH-CLI isn't reachable from haproxy's own check
# engine) -- noted, not yet built.
backend be_view
    server view1 10.0.0.164:80 check

backend be_ns1
    server ns1_1 10.0.0.194:53 check

backend be_bastion
    server bastion1 10.0.0.162:22 check

# Real, dedicated backend (2026-08-28) -- vmid 109, tcos-gopher-gateway,
# own container/IP per the real "clean separation" requirement, not
# sharing be_view's webroot like every other lab mirror so far.
backend be_gopher_gateway
    server gopher_gateway1 10.0.0.172:8070 check

# Real trigger (2026-08-26): 10.0.0.179 was the empty placeholder pve
# container (105) -- "container ready, app deploy deliberately paused."
# The real app was already live the whole time, just not routed here:
# thesis-dashboard.service on kiosk itself (10.0.0.100:4173, vite
# preview --host 0.0.0.0), running 2+ days with real Schwab sync
# workers active. Spencer, direct: "no html, this is old news. fire
# that up" -- pointed at the real instance instead of deploying a
# second one.
backend be_thesis
    server thesis1 10.0.0.100:4173 check
