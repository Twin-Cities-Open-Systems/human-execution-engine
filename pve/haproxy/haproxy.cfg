global
    log stdout format raw local0
    maxconn 2000

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# Real "the only view to see them all" dashboard, per Spencer's ask --
# HAProxy's own built-in stats page, live backend health, immediately
# real and useful even before any custom dashboard app exists.
frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
    stats admin if TRUE

# Real ACL-based host routing -- one frontend, backends selected by
# Host header. Adding a new service is a new acl + use_backend line +
# backend block, not new frontend/listener plumbing. Tiny/modular per
# the container topology, same principle applied to the proxy layer.
frontend http_in
    bind *:80
    acl host_view    hdr(host) -i view.lab.tcos.us
    acl host_ns1     hdr(host) -i ns1.lab.tcos.us
    acl host_bastion hdr(host) -i bastion.lab.tcos.us
    acl host_thesis  hdr(host) -i thesis-engine.lab.tcos.us
    use_backend be_view    if host_view
    use_backend be_ns1     if host_ns1
    use_backend be_bastion if host_bastion
    use_backend be_thesis  if host_thesis
    default_backend be_view

# Real backends, real container IPs (DHCP-assigned, checked live
# 2026-08-24) -- health-checked via a plain TCP connect for now.
# hee-pve-health needs an HTTP-exposed variant before it can back a
# real httpchk here (SSH-CLI isn't reachable from haproxy's own check
# engine) -- noted, not yet built.
backend be_view
    server view1 10.0.0.164:80 check

backend be_ns1
    server ns1_1 10.0.0.194:53 check

backend be_bastion
    server bastion1 10.0.0.162:22 check

backend be_thesis
    server thesis1 10.0.0.179:80 check
