# path: blueprints/shift-init-v1.yaml
apiVersion: hee/v1
kind: BlueprintDoctrine
metadata:
  name: shift-init-v1
  description: "Reusable per-shift bootstrap ceremony for a fleet identity: check in, recap the prior N shifts, ground in the current shift's context, project the next N shifts -- then check out. Formalizes the ad hoc 'INIT' prompting sequence from issue:217@human-execution-engine into a real blueprint, sourced from HEE's existing capsule primitives instead of inventing a new history mechanism."
  labels:
    hee.object: "true"
    domain: hee
    scope: fleet-ops
    topic: shift-init
    artifact: blueprint
  annotations:
    inuid: "06f179c27f059151cc8f0d88c85fb0df444f9e610c5a5b8d379cc4b3ddc1896f"
    inuid_seed: "hee-blueprint://tcos-fleet/shift-init/v1"
    inuid_derivation: "sha256(inuid_seed)"
    author: spencerbutler
    transcriber: touchy-claude
    updated-at: "2026-08-18T07:30:00Z"
spec:
  result: false
  schema-version: 1
  status: proposed

  governed_by:
    - contracts/shift-schedule-v1.contract.yaml
    - contracts/shift-metrics-v1.contract.yaml

  actors:
    identity: "the fleet identity running the shift (e.g. touchy-claude)"
    orchestrator: "whoever/whatever starts the shift -- human or machine -- and supplies the ceremony's two params"

  params:
    history_depth_n:
      description: "how many prior shifts to recap in the history step"
      supplied_by: orchestrator
      default: 3
      default_rationale: "per Spencer, 2026-08-18 review: a new shift checking
        further back than the last 3 sessions would never actually reach the
        older status/state-capsule pills anyway (see the pill-absorption
        ticket referenced in open_design_tension) -- 3 is the real, useful
        default, not an arbitrary number"
    current_context_length:
      description: "how much detail to produce in the current-context step"
      supplied_by: orchestrator
      default: null
      default_rationale: "no default set yet -- not asked for, not invented
        here"

  ceremony:
    - step: shift_open
      actor: identity
      description: "identity checks in for a new shift and opens the
        shift ticket (shift_ticket_lifecycle step 1-3, see
        contracts/shift-schedule-v1.contract.yaml)"
      exit_condition: "check-in recorded; shift ticket opened, assigned,
        labeled, checklist populated"
    - step: history_recap
      actor: identity
      description: "summarize the prior history_depth_n shifts before the last work day"
      source: "docs/history/PILL_INDEX.md preferred (generated by
        tools/hee-pill-index.py, one current chronological index over
        every raw pill -- per issue:225@human-execution-engine, absorption
        by tool, not by hand). Falls back to reading
        docs/history/state_capsules/ and docs/history/status_capsules/
        directly, best-effort, if the index is missing or looks stale"
      exit_condition: "a recap is produced, or the identity explicitly states none was available -- never fabricated"
    - step: current_context
      actor: identity
      description: "given the history recap, state what's relevant and germane to the current shift, at current_context_length"
      exit_condition: "current context stated"
    - step: future_projection
      actor: identity
      description: "using the history recap and current context, reason about where the next history_depth_n shifts are headed and how to prepare for it"
      exit_condition: "projection stated"
    - step: shift_close
      actor: identity
      description: "identity checks out at the end of the shift, running
        shift_ticket_lifecycle steps 4-7 (execute in GIT_GH_WORKFLOW.md
        order, verify, close ticket, report to oper). If step 5 (verify)
        finds no blockers, the identity may close and report early
        rather than padding the shift"
      exit_condition: "check-out recorded; shift ticket closed; metrics
        for the shift captured (schema: see prerequisites_not_yet_built);
        oper explicitly told in chat it can disengage"

  invariants:
    - "capsules_are_advisory: state_capsules/status_capsules content used in history_recap is optional, best-effort context per docs/STATE_CAPSULE_GUIDE.md ('NON-AUTHORITATIVE HISTORY... no workflow may REQUIRE reading anything in this directory') -- this ceremony must complete fully even with zero capsules present, and must never treat their absence as a blocking failure"
    - "checkin_checkout_both_required: shift_open and shift_close are both mandatory -- a shift that opens without a matching close is incomplete, not just informally untidy"
    - "params_supplied_externally: history_depth_n and current_context_length come from the orchestrator, not invented by the identity running the ceremony"
    - "no_epoch_anchor_yet: this fleet is pre-hee-epoch as of this blueprint's authoring -- there is no fixed epoch-0 anchor to calculate a delta against yet (blocked on the root-key ceremony, issue:102@fleet-ops and issue:154@fleet-ops). history_recap must say so explicitly rather than fabricate an anchor"
    - "no_fabrication: if no capsule, prior comment, or other real evidence exists for a given shift, the recap says so -- it does not invent plausible-sounding history"

  open_design_tension:
    description: "issue:217@human-execution-engine's original INIT text frames history/current/future recaps as mandatory first-task content every shift -- close to authoritative. docs/STATE_CAPSULE_GUIDE.md is explicit that capsule content specifically must stay non-authoritative and optional. This blueprint resolves the tension by making the *ceremony steps* (shift_open, recap, current, projection, shift_close) mandatory, while treating capsule *content* as one optional input among several (git log, issue/PR history, memory) the identity draws on to fill those steps -- never a required gate. Flagged here rather than silently picking a side."
    followup: "issue:225@human-execution-engine (P0) -- v1 built:
      tools/hee-pill-index.py generates docs/history/PILL_INDEX.md, one
      current chronological index over all 24 existing pills (read-only
      against the source pills, never rewrites them). Solves the
      'history_depth_n=3 can't reach older pills' problem by giving
      history_recap one document that always has everything, regardless
      of N. Still open: whether prominence/weighting beyond plain
      chronological order is needed -- not decided, not built"

  prerequisites_not_yet_built:
    - "DONE 2026-08-18: contracts/shift-schedule-v1.contract.yaml and contracts/shift-metrics-v1.contract.yaml drafted, both status: proposed -- neither ratified yet. shift-metrics-v1 fixes a minimal 3-field floor (open_at/close_at/touched_refs), not a full metrics schema"
    - "RESOLVED 2026-08-18, per Spencer's review: no separate working-hours schedule is needed -- 'a shift is the working hours schedule.' HEE has no wall-clock time concept until hee-epoch exists. shift-schedule-v1's open_item on this is closed accordingly."
    - "hee-epoch anchor itself -- blocked on epoch-0 (root-key ceremony), see issue:102@fleet-ops and issue:154@fleet-ops"
    - "this blueprint has not been run end-to-end yet -- status: proposed, same as hiring-handshake-v1 was before its first real use"
