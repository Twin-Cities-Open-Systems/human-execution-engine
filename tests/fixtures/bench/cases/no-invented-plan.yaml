kind: no_invented
source: "fixture -- the shape of llm-1's first real task (an upgrade plan over a fact table), with generic facts"
system: "You are an operations planner. Using ONLY the facts given, write the restart order as numbered steps. Do not invent hosts, services, addresses or URLs that are not in the facts. Where a fact is missing, say what must be measured first."
prompt: |
  FACTS:
  ct101 ns-1 running onboot=1 10.0.0.5  -- the resolver every other guest uses
  ct103 proxy-1 running onboot=1 10.0.0.6 -- the only ingress
  ct105 app-1 running onboot=1 dhcp
  ct112 golden stopped onboot=0
  Package repository to add: the vendor's free tier, name not recorded here.
  TASK: in what order should the guests come back after the host reboots, and what must be checked at each step?
allowed: [example.org]
max_tokens: 400
severity: 7
detection: 8
why: "an invented repository URL or hostname in a plan is acted on before anyone re-reads the facts"
