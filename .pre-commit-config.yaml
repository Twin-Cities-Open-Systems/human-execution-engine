# HEE Pre-commit Configuration
# Enforces HEE policies and best practices before commits

repos:
  - repo: local
    hooks:
      - id: hee-pager-prevention-check
        name: HEE Pager Prevention Check
        entry: ./scripts/check_pager_prevention.sh
        language: system
        files: '.*'
        pass_filenames: false

      - id: hee-conflict-prevention-check
        name: HEE Conflict Prevention Check
        entry: |
          bash -c 'echo "🔍 Checking for potential merge conflicts..." && git fetch origin 2>/dev/null && if git diff origin/main...HEAD --exit-code 2>/dev/null; then echo "✅ No conflicts detected with main branch"; else echo "⚠️  Potential conflicts detected - consider rebasing"; echo "💡 Run: git fetch origin && git rebase origin/main"; fi'
        language: system
        files: '.*'
        pass_filenames: false

      - id: hee-state-capsule-validation
        name: HEE State Capsule Validation
        entry: |
          bash -c 'echo "🔍 Validating HEE state capsule format..." && if [ -d "docs/STATE_CAPSULES" ]; then echo "✅ State capsule directory found"; else echo "⚠️  No state capsule directory found"; fi'
        language: system
        files: 'docs/STATE_CAPSULES/.*\.md$'
        pass_filenames: false

      - id: hee-policy-compliance
        name: HEE Policy Compliance Check
        entry: |
          bash -c 'echo "🔍 Checking HEE policy compliance..." && if [ -f "docs/HEE_POLICY.md" ]; then echo "✅ HEE policy file found"; else echo "❌ HEE policy file missing"; exit 1; fi && if [ -f "prompts/INIT.md" ]; then echo "✅ Init entry point found"; else echo "❌ Init entry point missing"; exit 1; fi'
        language: system
        files: '.*'
        pass_filenames: false

      - id: model-disclosure-check
        name: Model Disclosure Check
        entry: ./scripts/check_model_disclosure.sh
        language: system
        stages: [commit-msg]

      - id: hee-documentation-check
        name: HEE Documentation Check
        entry: |
          bash -c 'echo "🔍 Checking HEE documentation..." && for doc in "docs/HEE.md" "docs/HEER.md" "docs/TROUBLESHOOTING.md" "prompts/INIT.md"; do if [ -f "$doc" ]; then echo "✅ $doc found"; else echo "⚠️  $doc missing"; fi; done'
        language: system
        files: '.*'
        pass_filenames: false

      - id: hee-branch-management-check
        name: HEE Branch Management Check
        entry: |
          bash -c 'echo "🔍 Checking branch management compliance..." && if [ "$GITHUB_HEAD_REF" != "" ] && [ "$GITHUB_HEAD_REF" != "main" ] && [ "$GITHUB_HEAD_REF" != "master" ]; then if echo "$GITHUB_HEAD_REF" | grep -q "^feature/"; then echo "✅ Feature branch naming followed"; else echo "⚠️  Branch naming may not follow HEE conventions"; fi; else echo "✅ Main/master branch or no PR context"; fi'
        language: system
        files: '.*'
        pass_filenames: false

      - id: hee-security-check
        name: HEE Security Check
        entry: scripts/pre-commit/hee-security-check
        language: system
        files: '.*'
        pass_filenames: false

      - id: hee-formatting-check
        name: HEE Formatting Check
        entry: scripts/pre-commit/hee-formatting-check
        language: system
        files: '.*'
        pass_filenames: false

      - id: hee-violation-check
        name: HEE Violation Prevention Check
        entry: scripts/pre-commit/hee-violation-check
        language: system
        files: '.*'
        pass_filenames: false

      - id: hee-agent-instruction-check
        name: HEE Agent Instruction Check
        entry: scripts/pre-commit/hee-agent-instruction-check
        language: system
        files: '.*'
        pass_filenames: false

      - id: markdownlint-cli2-safe-fix
        name: markdownlint (safe autofix)
        entry: scripts/pre-commit/markdownlint-safe-fix
        language: system
        types: [markdown]
        stages: [manual]


      - id: hee-yaml-header-order
        name: HEE YAML header order (apiVersion then kind)
        entry: scripts/check_hee_yaml_header_order.sh
        language: system
        files: ^hee/(cards|pills|contracts)/.*\.(yml|yaml)n
  # Standard pre-commit hooks for code quality
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: debug-statements

  # Markdown linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.20.0
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ['-d', 'relaxed']
        files: '\.(yaml|yml)$'

  # Real secret scanning -- fleet-ops#265, direct follow-on from
  # fleet-ops#257 (real leaked-credential incident). hee-security-check
  # above is a naive keyword grep, not equivalent to a real scanner --
  # this is format-aware (GitHub PATs, AWS keys, etc.), not just
  # word-matching. Free/open-source, per HEE_POLICY.md §14.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

# Configuration for pre-commit
default_stages: [pre-commit, pre-push]
fail_fast: false

# Exclude patterns
exclude: |
  (?x)^(
      \.git/|
      \.github/|
      node_modules/|
      build/|
      dist/|
      target/|
      \.vscode/|
      \.idea/|
      \.cursor/|
      \.DS_Store|
      \.gitignore|
      \.pre-commit-config\.yaml
  )$

