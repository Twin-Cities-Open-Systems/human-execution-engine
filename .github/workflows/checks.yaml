name: checks

# Rule 16's two layers, which until 2026-09-01 existed only on paper:
#
#   ours       hee-check -- org-specific rot nothing else looks for, and it
#              needs no toolchain and no language runtime
#   standard   the standard linter for each language actually present:
#              shellcheck for shell, ruff for Python
#
# Measured that day: `rg 'hee check' .github/workflows/` returned nothing
# across all ten workflows, and neither shellcheck nor ruff was installed or
# named in tooling/tools.manifest.txt. So a PR could be merged straight past
# every one of these. See issue 500.
#
# WHAT BLOCKS AND WHAT DOES NOT, and why -- rule 16 again: "Never add a check
# that is red on day one [...] land it continue-on-error WITH the reason and
# the flip condition written in the workflow, and a ticket. A permanently-red
# check trains people to ignore red."
#
# Every job below is either green today, or carries its flip condition.

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  hee-check:
    name: hee-check (ours)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # hee-check itself needs no runtime, but `refs` and `regex` shell out
      # to rg and python3. python3 is preinstalled on ubuntu-latest.
      - name: Install rg
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # GREEN as of 712f86b, so it blocks.
      - name: boundary -- no derived state committed, no hardcoded homes
        run: tooling/bin/hee-check boundary

      # GREEN as of 712f86b, so it blocks.
      - name: regex -- shared patterns agree across every engine
        run: tooling/bin/hee-check regex

      # RED: 83 findings, and they are one decision rather than a cleanup --
      # docs/TROUBLESHOOTING.md and three others document ~20 scripts/*.py
      # files that do not exist. Fixing the paths would be worse than
      # deleting the docs.
      # FLIP TO BLOCKING when issue 504 is closed.
      - name: refs -- every file reference resolves
        continue-on-error: true
        run: tooling/bin/hee-check refs

      # GREEN: 54/54. It was written here continue-on-error with the flip
      # condition "when 514, 515 and 516 have landed". They landed, this
      # reports 54/54 conforming and exits 0, so it blocks. Flip conditions
      # are meant to be acted on, not accumulated.
      - name: cli -- every tool's help obeys the contract
        run: tooling/bin/hee-check cli

      # GREEN, and green by construction: the 18 findings it would have
      # reported were fixed in the same commit that added it (PR 514).
      - name: style -- US English in authored text
        run: tooling/bin/hee-check style

  shellcheck:
    name: shellcheck (standard, shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Preinstalled on ubuntu-latest. Printed rather than assumed, so a
      # runner image change that drops it shows up as a diff in the log
      # instead of a silently skipped check.
      - name: Version
        run: shellcheck --version

      # -S warning, not the default. GREEN at this severity as of this PR,
      # which fixed all 12 findings -- including two real bugs: stray
      # backslashes in live code in hee-vendor, and a malformed disable
      # directive in hee-reset-tooling that silenced nothing and stopped
      # shellcheck reading the rest of the file.
      #
      # 21 `note`-level findings remain (SC2086 word-splitting, SC2015
      # a&&b||c, SC2012 ls-parsing). Enforcing them today would be red on day
      # one, which rule 16 forbids.
      # FLIP TO -S style once those are triaged -- they need a ticket first.
      - name: shellcheck -S warning
        run: |
          # `if`, not `cmd && printf`. GitHub runs these steps under
          # `bash -e`, where a `&&` whose left side fails makes the whole
          # compound return non-zero -- inside $( ) that aborts the
          # substitution and kills the step. The ruff job below failed
          # exactly this way on this workflow's first run, in 0.1s, with no
          # output at all; this one passed only because the last file in its
          # glob happened to match.
          files="$(for f in tooling/bin/* library/bash/*.bash \
                            tooling/hooks/*.sh ci/git/*.sh; do
            [ -f "$f" ] || continue
            if head -1 "$f" | grep -qE '^#!.*(sh|bash)'; then
              printf '%s\n' "$f"
            fi
          done)"
          echo "checking $(printf '%s\n' "$files" | wc -l) shell files"
          # shellcheck disable=SC2086
          shellcheck -S warning -f gcc $files

  ruff:
    name: ruff (standard, Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned. An unpinned linter is a check whose meaning changes without
      # anyone editing it -- a new release adds a rule and main goes red on a
      # commit that touched nothing.
      - name: Install ruff
        run: pipx install ruff==0.16.5

      - name: Version
        run: ruff --version

      # --select E9,F: syntax errors and pyflakes. The tier that finds real
      # bugs -- an undefined name, an unused import, an f-string with no
      # placeholder -- rather than style opinions. GREEN as of this PR, which
      # fixed all 13.
      #
      # --isolated because this repo has no pyproject.toml or ruff.toml, so
      # without it ruff walks upward and picks up whatever config happens to
      # sit above the checkout. The ruleset belongs in the job, visible, not
      # inherited from a parent directory that differs per machine.
      #
      # Measured 2026-09-01: the full default ruleset reports 184 findings.
      # Landing that today would be red on day one.
      # FLIP TO a wider --select once those are triaged -- ticket first.
      - name: ruff check --select E9,F
        run: |
          # `if`, not `cmd && printf` -- see the note in the shellcheck job.
          files="$(for f in tooling/bin/*; do
            [ -f "$f" ] || continue
            if head -1 "$f" | grep -q python3; then
              printf '%s\n' "$f"
            fi
          done)"
          echo "checking library/py, tools/ and $(printf '%s\n' "$files" | wc -l) Python tools"
          # shellcheck disable=SC2086
          ruff check --isolated --select E9,F library/py tools $files
