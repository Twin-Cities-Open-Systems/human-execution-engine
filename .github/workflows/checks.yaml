name: checks

# Rule 16's two layers, which until 2026-09-01 existed only on paper:
#
#   ours       hee-check -- org-specific rot nothing else looks for, and it
#              needs no toolchain and no language runtime
#   standard   the standard linter for each language actually present:
#              shellcheck for shell, ruff for Python
#
# Measured that day: `rg 'hee check' .github/workflows/` returned nothing
# across all ten workflows, and neither shellcheck nor ruff was installed or
# named in tooling/tools.manifest.txt. So a PR could be merged straight past
# every one of these. See issue 500.
#
# WHAT BLOCKS AND WHAT DOES NOT, and why -- rule 16 again: "Never add a check
# that is red on day one [...] land it continue-on-error WITH the reason and
# the flip condition written in the workflow, and a ticket. A permanently-red
# check trains people to ignore red."
#
# Every job below is either green today, or carries its flip condition.

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  hee-check:
    name: hee-check (ours)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # hee-check itself needs no runtime, but `refs` and `regex` shell out
      # to rg and python3. python3 is preinstalled on ubuntu-latest.
      - name: Install rg
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # GREEN as of 712f86b, so it blocks.
      - name: boundary -- no derived state committed, no hardcoded homes
        run: tooling/bin/hee-check boundary

      # GREEN as of 712f86b, so it blocks.
      - name: regex -- shared patterns agree across every engine
        run: tooling/bin/hee-check regex

      # GREEN: all 406 references resolve. This landed continue-on-error at
      # 96 findings, with the condition "flip when issue 504 is closed". That
      # is what this change does, so it blocks -- and no soft job remains.
      - name: refs -- every file reference resolves
        run: tooling/bin/hee-check refs

      # GREEN: 54/54. It was written here continue-on-error with the flip
      # condition "when 514, 515 and 516 have landed". They landed, this
      # reports 54/54 conforming and exits 0, so it blocks. Flip conditions
      # are meant to be acted on, not accumulated.
      - name: cli -- every tool's help obeys the contract
        run: tooling/bin/hee-check cli

      # GREEN. Renamed from `style` when the operator reframed it: this is
      # locale conformance, not a list of British spellings.
      #
      # It runs WITHOUT the tool-locale provenance registry, deliberately.
      # That registry lives in the primitives repo, which is PRIVATE, and a
      # workflow's default GITHUB_TOKEN cannot read another repository --
      # measured here, first run: actions/checkout returned
      #
      #     ##[error]Not Found - .../rest/repos/repos#get-a-repository
      #
      # Reading it would need a PAT or a deploy key, which widens what this
      # workflow can reach. That is an operator decision and the same
      # credential question as fleet-ops#363, not something to grant here.
      #
      # The cost of going without is bounded and known: this repo has no
      # tmux config and no other file carrying a foreign config vocabulary,
      # so the exemption changes nothing here. The check SAYS it could not
      # load the registry rather than skipping quietly.
      #
      # Set HEE_PRIMITIVES locally and it uses it; ~/git/primitives is the
      # default, so an operator running this on kiosk already gets it.
      - name: locale -- text matches the declared locale
        run: tooling/bin/hee-check locale

      # GREEN. A tool's --help IS its man page (rule 17); a line in it marked
      # "# ci" is documentation and a test at once. This runs every one over
      # the checked-in fixtures and fails on a non-zero exit -- so the man
      # pages cannot drift from what the tools actually do. It also catches a
      # line MARKED "# ci" that is not a runnable "$ ..." example (the man
      # page would advertise it as proven while it never ran). Until this PR
      # it ran only post-merge, inside `hee-check all` in stable.yaml.
      - name: examples -- every '# ci' example in a tool's --help runs clean
        run: tooling/bin/hee-check examples

  shellcheck:
    name: shellcheck (standard, shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Preinstalled on ubuntu-latest. Printed rather than assumed, so a
      # runner image change that drops it shows up as a diff in the log
      # instead of a silently skipped check.
      - name: Version
        run: shellcheck --version

      # -S warning, not the default. GREEN at this severity as of this PR,
      # which fixed all 12 findings -- including two real bugs: stray
      # backslashes in live code in hee-vendor, and a malformed disable
      # directive in hee-reset-tooling that silenced nothing and stopped
      # shellcheck reading the rest of the file.
      #
      # 21 `note`-level findings remain (SC2086 word-splitting, SC2015
      # a&&b||c, SC2012 ls-parsing). Enforcing them today would be red on day
      # one, which rule 16 forbids.
      # FLIP TO -S style once those are triaged -- they need a ticket first.
      - name: shellcheck -S warning
        run: |
          # `if`, not `cmd && printf`. GitHub runs these steps under
          # `bash -e`, where a `&&` whose left side fails makes the whole
          # compound return non-zero -- inside $( ) that aborts the
          # substitution and kills the step. The ruff job below failed
          # exactly this way on this workflow's first run, in 0.1s, with no
          # output at all; this one passed only because the last file in its
          # glob happened to match.
          files="$(for f in tooling/bin/* library/bash/*.bash \
                            tooling/hooks/*.sh ci/git/*.sh; do
            [ -f "$f" ] || continue
            if head -1 "$f" | grep -qE '^#!.*(sh|bash)'; then
              printf '%s\n' "$f"
            fi
          done)"
          echo "checking $(printf '%s\n' "$files" | wc -l) shell files"
          # shellcheck disable=SC2086
          shellcheck -S warning -f gcc $files

  ruff:
    name: ruff (standard, Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned. An unpinned linter is a check whose meaning changes without
      # anyone editing it -- a new release adds a rule and main goes red on a
      # commit that touched nothing.
      - name: Install ruff
        run: pipx install ruff==0.16.5

      - name: Version
        run: ruff --version

      # --select E9,F: syntax errors and pyflakes. The tier that finds real
      # bugs -- an undefined name, an unused import, an f-string with no
      # placeholder -- rather than style opinions. GREEN as of this PR, which
      # fixed all 13.
      #
      # --isolated because this repo has no pyproject.toml or ruff.toml, so
      # without it ruff walks upward and picks up whatever config happens to
      # sit above the checkout. The ruleset belongs in the job, visible, not
      # inherited from a parent directory that differs per machine.
      #
      # Measured 2026-09-01: the full default ruleset reports 184 findings.
      # Landing that today would be red on day one.
      # FLIP TO a wider --select once those are triaged -- ticket first.
      - name: ruff check --select E9,F
        run: |
          # `if`, not `cmd && printf` -- see the note in the shellcheck job.
          files="$(for f in tooling/bin/*; do
            [ -f "$f" ] || continue
            if head -1 "$f" | grep -q python3; then
              printf '%s\n' "$f"
            fi
          done)"
          echo "checking library/py, library/rrr/src, tools/ and $(printf '%s\n' "$files" | wc -l) Python tools"
          # shellcheck disable=SC2086
          ruff check --isolated --select E9,F library/py library/rrr/src tools $files

  # GREEN on this PR, so it blocks. Issue 774: mt-logo-render's QR was
  # fractionally downscaled with NEAREST and silently stopped decoding at
  # some canvas sizes -- measured on flippy, 320 scanned while the larger
  # 384 and 448 did not. Nothing caught it because nothing ever read a
  # rendered PNG back. This job does: it renders at a spread of sizes and
  # asserts zbarimg returns exactly the payload that went in.
  #
  # The dependencies are all Debian/Ubuntu packages -- no pip, and no pipx
  # venv either, because the test shells out to a python3 that must be able
  # to import qrcode and PIL, and apt's python3-pytest runs under the same
  # interpreter that apt's python3-qrcode installs into.
  qr-roundtrip:
    name: pytest (standard, Python) -- the rendered QR decodes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the renderer's and the reader's real dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-qrcode python3-pil python3-pytest zbar-tools

      # Printed rather than assumed, same reason as the shellcheck job:
      # a runner image change shows up in the log, not as a silent skip.
      - name: Versions
        run: |
          zbarimg --version
          python3 -c "import PIL, qrcode; print('pillow', PIL.__version__)"
          python3 -m pytest --version

      # A SKIP here is a failure. The test skips itself when qrcode or
      # zbarimg is missing, which is honest on a laptop and a lie in CI --
      # this job exists precisely to have them installed.
      - name: QR round trip -- render, then read the pixels back
        run: |
          set -o pipefail
          python3 -m pytest tests/test_rrr_qr.py -q -rs | tee /tmp/qr-roundtrip.log
          if grep -qi skipped /tmp/qr-roundtrip.log; then
            echo "::error::the QR round trip SKIPPED -- qrcode or zbarimg missing on the runner"
            exit 1
          fi

  # The whole hee-* unit suite. Measured 2026-09-26: 34 test files, ~374
  # tests, all passing locally in ~45 s -- and NONE of them ran in CI. The
  # only pytest job here was the QR round trip above (issue 774); every other
  # tool test file (hee-cred, hee-pve-*, hee-view, hee-url, hee-check, ...)
  # ran nowhere. A test that never runs in CI is a test that silently rots.
  #
  # This runs everything EXCEPT test_rrr_qr.py, which the qr-roundtrip job
  # above already owns with its own rendered-pixel dependencies.
  tool-suite:
    name: pytest (standard, Python) -- the hee tool suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # age/age-keygen are the only binaries the suite needs that are not
      # already on ubuntu-latest (gpg, openssl, ssh-keygen, setsid are). A
      # test that skips itself for a missing tool is honest on a laptop and a
      # lie in CI -- so we install it and, below, FAIL on any skip.
      - name: Install the suite's real dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          pipx install pytest==8.3.3
          pipx inject pytest pyyaml cryptography

      - name: Versions
        run: |
          age --version || true
          gpg --version | head -1
          openssl version
          pytest --version

      # A SKIP is a failure, same rule as the QR job: the suite's skipif
      # guards exist for a laptop that lacks age or gpg, not for CI, where
      # this job installs them. -rs so any skip is named in the log.
      - name: pytest tests/ (all but the QR round trip)
        run: |
          set -o pipefail
          pytest tests/ --ignore=tests/test_rrr_qr.py -q -rs -p no:cacheprovider \
            | tee /tmp/tool-suite.log
          if grep -qiE '^SKIPPED|[1-9][0-9]* skipped' /tmp/tool-suite.log; then
            echo "::error::a tool test SKIPPED -- a dependency is missing on the runner; install it in this job rather than skipping"
            exit 1
          fi
