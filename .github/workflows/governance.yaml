name: HEE Governance Testing CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  lint-checker:
    name: Lint Governance Checker
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Enforce frozen governance operations guardrails
      run: bash ci/governance/ops_guard.sh

    - name: Lint governance checker
      run: |
        echo "🔍 Running governance-aware linting...TODO(spencer) convert to script"

        # Ensure shellcheck is available
        if ! command -v shellcheck &> /dev/null; then
          echo "Installing shellcheck..."
          sudo apt-get update && sudo apt-get install -y shellcheck
        fi

        # Lint the main checker script
        shellcheck ci/governance/check.sh

        # Enforce governance hygiene
        echo "🔍 Checking governance hygiene...TODO(spencer) convert to script"

        # Ensure set -euo pipefail is used
        if ! grep -q "set -euo pipefail" ci/governance/check.sh; then
          echo "❌ check.sh must use 'set -euo pipefail'"
          exit 1
        fi

        # Ensure single entrypoint (no arbitrary sourcing)
        if grep -o "source.*\.sh" ci/governance/check.sh | grep -v "rules.sh" | grep -q .; then
          echo "❌ check.sh must not source arbitrary files (only rules.sh)"
          exit 1
        fi

        # Ensure rules.sh is only sourced from check.sh
        if ! grep -q "source.*rules.sh" ci/governance/check.sh; then
          echo "❌ check.sh must source rules.sh"
          exit 1
        fi

        echo "✅ Governance checker linting passed"

  governance-real:
    name: Test Against Real Repository
    needs: lint-checker
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run governance check on repository
      run: |
        echo "🔍 Running governance check against real repository...TODO(spencer) convert to script"
        bash ci/governance/check.sh --path .

  governance-fixtures:
    name: Test Governance Fixtures
    needs: lint-checker
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Test ok-minimal fixture (should pass)
      run: |
        echo "🔍 Testing fixture: ok-minimal (expected: PASS)...TODO(spencer) convert to script"
        set +e
        output="$(bash ci/governance/check.sh --path hee/governance/fixtures/ok-minimal 2>&1)"
        exit_code=$?
        set -e

        printf '%s\n' "$output"
        echo "exit=$exit_code"

        if [ $exit_code -ne 0 ]; then
          echo "❌ Expected ok-minimal to pass, but got exit $exit_code"
          exit 1
        fi
        echo "✅ ok-minimal fixture validation passed"

    - name: Test bad-missing-prompts fixture (should fail with GOV-STRUCT-001)
      run: |
        echo "🔍 Testing fixture: bad-missing-prompts (expected: FAIL with GOV-STRUCT-001)...TODO(spencer) convert to script"
        set +e
        output="$(./ci/governance/check.sh --path hee/governance/fixtures/bad-missing-prompts 2>&1)"
        exit_code=$?
        set -e

        printf '%s\n' "$output"
        echo "exit=$exit_code"

        if [ $exit_code -ne 1 ]; then
          echo "❌ Expected bad-missing-prompts to fail, but got exit $exit_code"
          exit 1
        fi
        if ! echo "$output" | grep -q "GOV-STRUCT-001"; then
          echo "❌ Expected GOV-STRUCT-001 violation not found in output"
          exit 1
        fi
        echo "✅ bad-missing-prompts fixture validation passed"

    - name: Test bad-missing-doctrine-doc fixture (should fail with GOV-STRUCT-001, GOV-DOC-001)
      run: |
        echo "🔍 Testing fixture: bad-missing-doctrine-doc (expected: FAIL with GOV-STRUCT-001, GOV-DOC-001)...TODO(spencer) convert to script"
        set +e
        output="$(bash ci/governance/check.sh --path hee/governance/fixtures/bad-missing-doctrine-doc 2>&1)"
        exit_code=$?
        set -e

        printf '%s\n' "$output"
        echo "exit=$exit_code"

        if [ $exit_code -ne 1 ]; then
          echo "❌ Expected bad-missing-doctrine-doc to fail, but got exit $exit_code"
          exit 1
        fi
        if ! echo "$output" | grep -q "GOV-STRUCT-001"; then
          echo "❌ Expected GOV-STRUCT-001 violation not found"
          exit 1
        fi
        if ! echo "$output" | grep -q "GOV-DOC-001"; then
          echo "❌ Expected GOV-DOC-001 violation not found"
          exit 1
        fi
        echo "✅ bad-missing-doctrine-doc fixture validation passed"

    - name: Test bad-prompt-missing-authority fixture (should fail with GOV-PROMPT-001)
      run: |
        echo "🔍 Testing fixture: bad-prompt-missing-authority (expected: FAIL with GOV-PROMPT-001)...TODO(spencer) convert to script "
        set +e
        output="$(bash ci/governance/check.sh --path hee/governance/fixtures/bad-prompt-missing-authority 2>&1)"
        exit_code=$?
        set -e

        printf '%s\n' "$output"
        echo "exit=$exit_code"

        if [ $exit_code -ne 1 ]; then
          echo "❌ Expected bad-prompt-missing-authority to fail, but got exit $exit_code"
          exit 1
        fi
        if ! echo "$output" | grep -q "GOV-PROMPT-001"; then
          echo "❌ Expected GOV-PROMPT-001 violation not found"
          exit 1
        fi
        echo "✅ bad-prompt-missing-authority fixture validation passed"

  hello-world-execution:
    name: HEE Hello World Execution
    needs: governance-fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run hello world workload
        shell: bash
        run: ./workloads/hello-world/run.sh
