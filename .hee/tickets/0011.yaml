description: 'P1: tmux-agent launcher under-reports input devices in discovery.txt.
  SUPERSEDED by fleet-ops ticket 0122 -- see https://github.com/Twin-Cities-Open-Systems/fleet-ops/pull/604,
  where the fix lands. Kept here as the record of a real footgun in this system, not
  as open work. The bug: bin/tmux-agent-start.sh:158 ran `grep -iB2 ''touch'' /proc/bus/input/devices
  | grep -i name='', matching the literal string ''touch''. On flippy that found only
  ''SYNA329A:00 06CB:CD4F Touchpad'' and missed the entire ELAN2514:00 04F3:2975 block
  -- the x360''s I2C touchscreen and its Stylus digitizer -- because those names contain
  no ''touch''. Measured 2026-09-17: the old line reports 1 device, the fix reports
  30. Agents are instructed to trust discovery.txt over the entry doc, so a convertible
  reported as having no touchscreen: silence read as a real negative result, PROMPTING_RULES
  rule 2. WHY IT WAS FILED IN THE WRONG REPO, which is the part worth keeping: the
  file lives in fleet-ops, but on 2026-09-16 fleet-ops was not cloneable from claude@flippy
  -- that host''s SSH key was generated and never registered, so the session that
  found the bug could not file where the code lives and wrote it here instead. The
  key is registered now. A ticket parked in the wrong repo because of a missing credential
  is a real cost of leaving a host half-onboarded, and it is the reason this one sat
  unfiled and uncommitted for a day.'
