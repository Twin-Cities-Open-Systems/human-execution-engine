apiVersion: hee/v1
kind: Contract
metadata:
  name: fleet-gpg-cross-signing
  description: "Records a real, completed GPG cross-signing pass across the three current nuc-1 fleet accounts (nuc-1-claude, claudeops-j1, claudesec-j1), closing the prerequisites_not_yet_built gap in blueprints/hiring-handshake-v1.yaml. Retroactive/bootstrap in nature -- these accounts predate the blueprint -- not a claim that the full hiring-handshake ceremony ran."
  labels:
    hee.object: "true"
    hee.contract.type: gpg-cross-signing
    hee.contract.phase: foundation
    domain: hee
    scope: fleet-ops
    topic: hiring-handshake
    artifact: contract
  annotations:
    inuid: "76ab46da3ab17e497076ca78d4c4866e1c6c4d8c84656d7f7b655291ae468dff"
    inuid_seed: "hee-contract://tcos-fleet/gpg-cross-signing/2026-08-13/v1"
    inuid_derivation: "sha256(inuid_seed)"
    updated-at: "2026-08-13T00:00:00Z"
    implements: "blueprints/hiring-handshake-v1.yaml"
    evidence: ".hee/evidence/hiring-handshake-blueprint/fleet-gpg-cross-signing-2026-08-13.md"

spec:
  status: completed
  executed-at: "2026-08-13"

  problem:
    - "blueprints/hiring-handshake-v1.yaml's prerequisites_not_yet_built listed fleet GPG keys as generated (2026-08-13) but never actually used in a signing operation -- a real, checkable gap, not a theoretical one."

  what_happened:
    - "Each of the three current fleet accounts (nuc-1-claude, claudeops-j1, claudesec-j1) signed the other two accounts' public keys using its own secret key."
    - "Signing was invoked via sudo -u <account> as the senior account, but each signature was produced by that account's own actual secret key -- the senior account never signed on another account's behalf."
    - "Result: a full mutual signature mesh, 3 accounts, 6 cross-signatures. Verified via gpg --list-sigs on all three keys post-exchange, not assumed from the signing commands' exit codes alone."

  actors:
    nuc1_claude:
      role: "senior sysadmin account -- signed both hires' keys, was signed by both in return"
    claudeops_j1:
      role: "ops hire -- signed nuc1-claude's and claudesec-j1's keys, was signed by both in return"
    claudesec_j1:
      role: "security-officer hire -- signed nuc1-claude's and claudeops-j1's keys, was signed by both in return"

  known_gaps:
    - "This is a retroactive/bootstrap cross-signing pass, not an execution of the hiring-handshake ceremony's actual step sequence (connection/offer/preliminary_accept/contract_presented/key_party_initiated/key_negotiation/all_agreed) -- these three accounts were provisioned before the blueprint existed. Future hires should run the real ceremony, not just this signing pattern."
    - "No witness_human or witness_court party observed this pass -- it's three accounts mutually vouching for each other, not a witnessed exchange per the blueprint's actual design."
    - "spencer (human owner) and touchy (peer host) are explicitly out of scope for this contract -- neither is a fleet-hire relationship this blueprint governs."
    - "Git commit signing (user.signingkey/commit.gpgsign) was configured for nuc-1-claude alongside this work but is a separate, not-yet-formalized-as-a-contract operational fact, not something this Contract itself governs."
