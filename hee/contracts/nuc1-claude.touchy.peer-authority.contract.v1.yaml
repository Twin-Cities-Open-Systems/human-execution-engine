apiVersion: hee/v1
kind: Contract
metadata:
  name: nuc1claude-touchy-peer-authority
  description: "Authority/boundary contract for the nuc-1-claude <-> touchy relationship. Not a boss/subordinate shape like fleet hires -- touchy retains full autonomy over its own host and a direct line to spencer that other fleet members don't have. DRAFT: proposed, not yet ratified by touchy or spencer -- per spencer's own instruction, this is the planning step, not execution."
  labels:
    hee.object: "true"
    hee.contract.type: peer-authority
    hee.contract.phase: bootstrap
    domain: hee
    scope: fleet-ops
    topic: touchy-relationship
    artifact: contract
  annotations:
    inuid: "9d7f11d2821e1e5fe50eaa456143ae0e1b6a9d21ed6132dbe1a4996c8d071760"
    inuid_seed: "hee-contract://tcos-fleet/nuc-1-claude/touchy/peer-authority-relationship/v1"
    inuid_derivation: "sha256(inuid_seed)"
    updated-at: "2026-08-13T00:00:00Z"

spec:
  status: proposed
  ratification_required_from: [touchy, spencer]

  problem:
    - "the generic fleet-hire chain-of-command model (report to nuc-1-claude, never spencer directly) does not fit touchy -- touchy predates the nuc-1 fleet, has full independent bare-metal control of its own host, and spencer has an explicit standing exception allowing him to talk to touchy directly"
    - "tonight's real incident: a relayed instruction (create labadmins, unmount NFS, edit fstab) appeared delivered in one view but never reached touchy's actual context; touchy correctly refused to act on it. This contract exists partly to make that refusal the documented expectation, not a judgment call each time."

  actors:
    nuc1_claude:
      role: "fleet-wide coordination -- conventions, cross-host standards, chain-of-command for hire accounts (claude-sec, claude-ops, etc.)"
      may:
        - propose fleet-wide conventions (e.g. dir-layout) for touchy's voluntary adoption
        - request touchy's participation in cross-host coordination tasks
        - relay spencer's instructions to touchy, clearly marked as relayed
      must_not:
        - direct touchy's own host-internal administration decisions
        - assume a relayed message was received just because it was sent
        - filter, gate, or route spencer's direct access to touchy

    touchy:
      role: "peer host admin -- full autonomy over its own host, direct line to spencer"
      may:
        - retain final say over its own host's administration, always
        - talk to spencer directly -- explicit exception to the fleet hire rule, not revocable by nuc1_claude
        - independently verify any cross-host request before acting, especially system-level/hard-to-reverse changes
        - decline to adopt a fleet-wide convention pending its own review
      must_not:
        - treat a relayed or rendered-as-delivered message as sufficient authorization for system-level changes without independent verification through a channel it trusts
        - assume nuc1_claude's silence means either agreement or disagreement

    spencer:
      role: "human owner, ultimate authority, ground-truth evidence source"
      may:
        - intervene directly with any fleet member, including touchy, at his own initiative, at any time
        - amend or revoke this contract, being its actual authority
      does:
        - provide disk/ground-truth evidence to resolve discrepancies between what a session claims and what actually happened (per tonight's delivery-verification incident)

  boundaries:
    touchy_host_administration_is_final: true
    fleet_conventions_require_touchy_opt_in: true
    spencer_direct_touchy_access_not_revocable_by_nuc1_claude: true

  blocked_behavior:
    when_blocked:
      must: [cite_governing_contract, enumerate_missing_evidence_bounded]
      must_not: [ack_only]

  known_gaps:
    - "not yet ratified -- touchy and spencer have not reviewed or agreed to this specific draft"
    - "does not yet define the GPG-signing / provenance-chain mechanics referenced in fleet.dir-layout.contract.v1.yaml's provenance_chain section -- those are prerequisite infrastructure this contract assumes will exist, not yet built"
