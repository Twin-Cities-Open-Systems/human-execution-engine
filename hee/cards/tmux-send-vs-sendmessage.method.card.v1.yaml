apiVersion: hee/v1
kind: Card
metadata:
  name: tmux-send-vs-sendmessage
  ts_human: 2026-08-25_2300
  description: "Real, demonstrated reasons TCOS prefers tmux send-keys over SendMessage for live human-agent communication, plus the resolved lightweight signature convention for it."
  labels:
    hee.object: "true"
  annotations:
    inuid: null
    inuid_null_reason: bootstrap
    created_utc: "2026-08-25T20:45:17-05:00"
spec:
  purpose: >
    Document why tmux send-keys is the preferred channel over
    SendMessage for reaching a human directly, and settle what
    identity-marking it needs (it is NOT the same as the full
    agent-instance-signature block -- see resolution below).
  reasons:
    - "SendMessage has repeatedly, demonstrably failed to deliver this
      session: real notices such as \"14 of your messages... were not
      approved before expiry\" and \"2 of your messages... were not
      approved before expiry\" -- per-message recipient approval that
      can simply not happen, silently, no retry."
    - "tmux send-keys worked instantly, every time it was tried, and was
      independently verified landing via capture-pane in the same tool
      call -- zero observed failures against SendMessage's real,
      repeated failure rate the same session."
    - "No approval gate at all -- if you can see the pane, the message
      lands. SendMessage's approval requirement is a real, deliberate
      security feature, but it is also the exact mechanism causing the
      delivery failures above."
    - "Directly visible, not queued -- lands in a terminal the human is
      already looking at, not a separate inbox/notification system
      requiring a deliberate check."
    - "Real, physical-presence proof -- only works against an actual
      live tmux server on a real, currently-running machine. Stronger
      than an abstract socket address."
    - "Real-time, synchronous, human-in-the-loop -- confirmed live:
      Spencer typed a real reply directly back into the same pane
      immediately after a message landed. SendMessage is async/delayed
      by design."
    - "Zero new infrastructure -- reuses a tmux server that already
      exists; no separate messaging daemon, protocol, or
      delivery-approval system to build or maintain."
    - "Unambiguous addressing -- session:window.pane names one specific,
      real, currently-open terminal. A SendMessage recipient address
      doesn't tell you where, or whether, a human is actually watching."
  origin: >
    Spencer, 2026-08-25: "we prefer tmux send messae to sendMessage,
    let's document why (the list is very long)." Came directly out of
    hee-con -tmux-send (same session) being used live, successfully,
    while SendMessage delivery notices were failing in the same
    conversation.
  important_nuance: >
    This is NOT "SendMessage is broken, replace it." Real existing
    doctrine (human-execution-engine#303, 2026-08-23) already found the
    same held-for-approval behavior and explicitly framed it as a
    deliberate, correct security feature -- "real infrastructure already
    enforcing exactly the human-in-the-loop principle... a working
    example to point at, not just a friction point to route around,"
    tying directly to #302's "machines have 0 rights until granted"
    model. That framing stands; this card doesn't contradict it.
    The real, narrower point here: for live human<->agent communication
    on a shared host (this exact scenario -- an agent and a human on the
    same real tmux server), tmux send-keys is a better-fitted mechanism
    for THAT case specifically -- instant, synchronous, no approval gate
    needed because physical/pane-level presence already proves what the
    approval gate exists to establish for a remote, unverified peer.
    SendMessage's gate remains correct and necessary for its own real
    case: cross-session, cross-identity, not-otherwise-verified comms.
    Different tools for different trust situations, not a replacement.
  signature_resolution:
    question: "Does a tmux-send message need the full
      agent-instance-signature-v1 block appended, the same as
      SendMessage traffic and GitHub comments?"
    answer: "No -- resolved directly by Spencer (\"tmux send keys #
      you know that\"): a plain '# '-prefixed shell comment is
      sufficient, naming the sending identity inline only when it
      actually matters for clarity (e.g. '# yes, I see you -
      touchy-claude, same host, same tmux server'). The full multi-line
      block would be genuinely noisy pasted into a live terminal for a
      one-line ack, and tmux-send already carries strong identity proof
      on its own (a real pane on a real live server, per the reasons
      above) that SendMessage/GitHub comments don't have."
    already_practiced: "This is exactly the format already used live
      this session before the question was even raised -- the
      resolution formalizes existing practice, not a new convention."
  cross_reference: "contracts/agent-instance-signature-v1.contract.yaml
    -- that contract's own must-list (SendMessage, GitHub comments)
    should note tmux-send as a real third channel with this lighter
    requirement, not silently omit it."
  dogfood_shell_addendum:
    scope: "Extends this card from message-delivery to action-execution:
      when an agent needs to DO something inside spencer@kiosk's
      unprivileged dogfood shell specifically (not just message Spencer),
      prefer tmux send-keys into his real, live pane over a silent
      `sudo -u spencer` side-channel."
    origin: "Spencer, 2026-08-26: \"we now prefer tmux send for comms
      when working in my spencer@kiosk unpriv dogfood shell\" -- raised
      live while diagnosing a real hee-toolchain staleness issue in
      that account."
    why: "spencer@kiosk is permanently unprivileged by design -- that's
      the whole point of the dogfood account (see fleet-ops precedent:
      never propose sudo or a privileged workaround for it). An agent
      reaching in via `sudo -u spencer` to act as him, invisibly, cuts
      against that same design intent even when the action itself is
      benign (e.g. a git pull) -- it happens outside his own terminal,
      unseen. tmux send-keys into his real pane keeps every action
      visible in the same live session he's actually watching, same
      transparency rationale as the message-delivery case above, just
      applied to command execution instead of chat."
    practice: "Prefer `tmux send-keys -t <session:window.pane> '<cmd>'
      Enter` against spencer@kiosk's real pane over `sudo -u spencer
      bash -c '...'`. Reserve the sudo side-channel for read-only
      diagnosis (e.g. checking file state before acting) where landing
      a command in his live pane would be noise, not signal."
  status: dogfood
