# path: contracts/fleet-identity-v1.contract.yaml
apiVersion: hee/v1
kind: Contract
metadata:
  name: fleet-identity
  description: "How a fleet identity comes into existence, how it is anchored, and what may root through it. Real trigger 2026-09-02: prompts/INIT.md has carried the caveat 'no identity in this fleet has one yet' about .hee/index/_.yaml since it was written, so the hash-chain primitive in library/py/hee_hash/soa.py has had nothing to root off. This contract fixes the rules that anchor needs to satisfy before anything is built against it."
  labels:
    hee.object: "true"
    hee.contract.type: identity
    domain: hee
    scope: fleet-ops
    topic: fleet-identity
    artifact: contract
  annotations:
    inuid: "49961f96902f081e173dbbe0667c6ae87962102b1c06105d0182638af66b3044"
    inuid_seed: "hee-contract://tcos-fleet/fleet-identity/v1"
    inuid_derivation: "sha256(inuid_seed)"
    author: spencerbutler
    transcriber: touchy-claude
    created_utc: "2026-09-02T17:00:00Z"

spec:
  result: false
  schema-version: 1
  status: proposed

  intent:
    - "An identity is a container, not a record about a container. bast-<oper> IS the operator's identity in the fleet; there is no separate directory to drift from it."
    - "Durability is visible in DNS. A record is what makes an identity real, and an identity with no record can be destroyed without consequence."
    - "Nothing roots through anything that can be destroyed casually."

  definitions:
    ephemeral_bastion:
      naming: "bast-<hee-name>-<oper|agent>"
      dns: "none -- no A record, no PTR"
      anchor: "none -- no .hee/index/_.yaml"
      lifecycle: "created and destroyed freely; names come from a hee-name pool under the 'bastion' scope and are released on destroy"
    durable_bastion:
      naming: "bast-<oper|agent>"
      dns: "A + PTR, both generated from one '=' line in the hee-dns host file"
      anchor: "~/.hee/index/_.yaml -- the single source of truth for that identity"
      lifecycle: "permanent; never casually destroyed or recreated"

  invariants:
    - "name_always_declares_role: every bastion name ends in '-oper' or '-agent', with no exceptions and no bare form. Operator, 2026-09-02: 'never just bast-homer, must always ending in oper|agent name... always.' The live ledger at .hee/name-allocations/bastion.yaml holds exactly one entry, 'bast-homer' from 2026-08-24, which predates this rule and is malformed under it -- proof that the bare form is what gets allocated when nothing rejects it. hee-name must refuse to allocate into the bastion scope without a role suffix; a convention that only a reader enforces is not an invariant."
    - "record_and_address_together: promotion assigns a STATIC address in the same step that adds the DNS record. An ephemeral on DHCP gets an address that recycles, and a PTR outliving its container makes reverse lookups lie -- which is worse than no PTR, because monitoring and logs believe it."
    - "no_anchor_without_record: an identity anchor exists only where a durable DNS record exists. This is what makes ephemeral destruction free."
    - "ssot_is_the_bastion: the durable bastion's .hee/index/_.yaml is authoritative. Public presence at tcos.us/people/<oper|agent> is DERIVED from it and never hand-maintained; derivation is a filtered projection through publish-sanitization-v1, not a dump."
    - "replication_is_identity_durability: because the SSOT lives in the container, backup of durable bastions is not housekeeping -- it is whether an identity survives a disk. Durable bastions live on a replicated pool, and a restore must have been TESTED, not merely configured."
    - "isolation_is_structural: bast-<oper> shares nothing with agent bastions -- no bind mounts, no group overlap, no reachable export. The reason is not credential hygiene; it is that the chain must not be forgeable upward."
    - "key_material_is_recoverable: an identity key generated at init is sealed to the operator's existing recipients before the anchor is written. If sealing fails, no anchor is written -- an unrecoverable identity is worse than no identity."
    - "local_identity_is_not_fleet_membership: 'make install' produces a local identity. Joining the fleet requires an existing member to vouch (blueprints/hiring-handshake-v1.yaml). Collapsing the two makes onboarding smoother and the trust model meaningless."

  certificates:
    internal:
      issuer: "fleet root CA (owner@dogfood)"
      covers: "service-to-service -- IRC/soju, SMTP/mx1, Proxmox, anything configured rather than browsed"
      rationale: "issuance, rotation and revocation stay in the fleet"
    edge:
      issuer: "Let's Encrypt"
      covers: "browser-facing *.lab.tcos.us at the haproxy edge"
      rationale: "an internal CA requires its root in every browser; LE already works with zero trust distribution, so replacing it would be a UX downgrade for no security gain"
    obligation:
      - "the fleet root must be present in the container template, so a freshly cloned bastion trusts the fleet on first boot without a manual step. Trust distribution, not issuance, is the real work."

  known_blockers:
    - "hee-name writes allocations to repo_root()/.hee/name-allocations of the CURRENT DIRECTORY's repo. Two callers in different directories receive the same name and neither sees the collision -- observed 2026-09-02, a pve-storage allocation landed in the thesis-engine repo. This must be fixed before hee-name allocates real identities."
    - "hee-cred seals without --trust-model always, so an untrusted recipient key makes gpg prompt DURING secret entry and the operator's keystrokes answer the prompt instead. Observed twice on 2026-09-02: a 69-character key stored as 1 character and then 7. The double-prompt confirm cannot catch it because both reads truncate identically. It must also report the captured length."
    - "hee-cred's docstring states storage is git-tracked ciphertext; fleet-ops/.gitignore excludes .hee/secrets/. Sealed material therefore lives on exactly one machine and dies with it, which is disqualifying for identity keys."

  # Both entries that stood here were withdrawn on 2026-09-02. Neither was an
  # open question; each was this contract failing to look up work that already
  # existed. Recorded as a correction rather than silently deleted, because the
  # failure mode -- restating a settled thing as undecided -- is the one that
  # makes a contract actively misleading rather than merely incomplete.
  resolved_not_open:
    root_ca_attestation:
      withdrawn: "2026-09-02"
      asked: "What attests to the root CA itself?"
      answer: "The SLIP-39 air-gapped root-of-trust ceremony, which this fleet has already designed and practiced once. It is not a question this contract gets to reopen."
      tracked_by:
        - "fleet-ops#102 -- Root-of-trust bootstrap: PEN/OID, root+intermediate CA, SSH CA, GPG root, built consistently from 0 (OPEN)"
        - "fleet-ops#154 -- Epoch-0 readiness checklist (OPEN)"
        - "fleet-ops#74 -- Linux UID/GID scheme traceable to HEE root identity (CLOSED), which fixed the governing requirement: 'you should be able to take any object and trace it back to the origin (pve: spencer@owner:~/.hee/index/_.yaml). This must be true as soon as that file is created.'"
      standing_in_hee: "prompts/INIT.md already states this repo is a conceptual root and NOT a cryptographic one, because no identity in this fleet has a .hee/index/_.yaml yet. That file is this contract's prerequisite, not its open question."
    signature_validity_after_retirement:
      withdrawn: "2026-09-02"
      asked: "When a durable bastion is retired, what happens to artifacts it signed?"
      answer: "It is a defect in the decommissioning path, not an open design question. Per the operator: 'should already be part of the decomm process, bug if not.' It is not -- fleet-ops/bin/decom-agent.sh handles processes only, with zero key-material handling."
      tracked_by:
        - "fleet-ops#366 -- Decommissioning has no key-material step; retired identities' signatures are undefined"
      note: "The archived-attestation vs re-derivable-verification tradeoff is stated in full on #366. It constrains the root-of-trust design, so it is settled alongside fleet-ops#102 rather than after it."
