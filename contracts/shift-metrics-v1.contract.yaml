# path: contracts/shift-metrics-v1.contract.yaml
version: shift-metrics-v1
name: shift-metrics
title: Fleet Identity Shift Metrics Contract

intent:
  - "require that every shift run under shift-schedule-v1 records a
    minimal, honest set of metrics at shift_close"
  - "stay deliberately thin -- #217's CORE section calls the metrics
    schema itself tbd; this contract fixes the floor, not the final shape"

actors:
  identity:
    must:
      - record shift_open_at and shift_close_at timestamps for every shift
      - record which tickets/PRs/commits the shift actually touched
      - state explicitly when a metric can't be captured, rather than
        omitting it silently
    must_not:
      - fabricate a metric value it didn't actually observe
      - close a shift without recording the minimal set above

boundaries:
  governs: blueprints/shift-init-v1.yaml
  minimal_fields:
    - shift_open_at
    - shift_close_at
    - touched_refs
  schema_status: "TBD -- this is the floor, not a final schema. A richer
    metrics schema (velocity, blockers-hit, whatever else Spencer wants
    tracked) is future work, not invented here"

blocked_behavior:
  when_blocked:
    must:
      - cite_governing_contract
      - enumerate_missing_evidence_bounded
    must_not:
      - ack_only
